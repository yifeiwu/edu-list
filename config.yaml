# Settings for the incremental edu-domains crawler.
# Free-tier safe: each run is capped by time + validation count.

run:
  # Max wall-clock seconds for the whole crawl step (workflows run hourly
  # with a 30-min job timeout; keep headroom for pip install + commit).
  max_seconds: 1500
  # Hard cap on HTTP validations per run (new + re-verify combined).
  # Hourly scale: ~150/run x 24 ≈ one old twice-daily budget spread out.
  max_validations: 150
  # How many NEW domains to validate per run (rest deferred via cursors).
  max_new_per_run: 100
  # How many existing rows to re-verify when NO new domains found.
  verify_batch_no_new: 60
  # How many existing rows to piggyback-verify when new domains WERE found.
  verify_batch_with_new: 15
  # After this many consecutive Inaccessible results, stop re-checking monthly;
  # row is kept (archived) but skipped by oldest-N rotation for `archive_skip_days`.
  archive_after_failures: 6
  archive_skip_days: 90
  # Cap on queued unvalidated candidates (curate defers overflow to next run).
  max_pending: 8000

verify:
  # Overrides for `run.*` above (verify.py falls back to `run.*` when a key
  # is missing here). Values differ intentionally: verify hits each website
  # once (homepage only, distributed hosts), so it runs hourly with a small
  # cap. ~125 validations/run x 24 ≈ the old twice-daily 1500 x 2 budget
  # spread over the day, fitting the 25-min budget (0.4s politeness + 10s
  # timeout worst-case, deadline guard still truncates slow runs).
  max_validations: 125
  max_new_per_run: 100
  verify_batch_no_new: 60
  verify_batch_with_new: 15

validation:
  timeout_seconds: 10
  # Homepage bytes to inspect (title/H1/schema/keywords).
  max_bytes: 32768
  politeness_delay_seconds: 0.4
  # Transient transport retry (ConnectionError/Timeout only; TLS and HTTP
  # statuses are never retried).
  retries: 1
  retry_backoff_seconds: 1.0
  user_agent: "edu-domains-bot/1.0 (+https://github.com/yifeiwu/edu-domains; contact: billy.gumdrop066@slmails.com )"
  # Confidence >= threshold => Active (provided final HTTP status is 2xx + HTML).
  active_threshold: 50
  # Exa second-opinion for dissimilar cross-domain redirects
  # (e.g. rhul.ac.uk -> royalholloway.ac.uk). Only consulted when the redirect
  # target's registrable base differs ("quite different") to confirm the final
  # site is a real institution vs a parking page. Disabled automatically when
  # no API key is set — set EXA_API_KEY env var (wins) or fill exa_api_key
  # below. Budget-capped per run + cached 90d in state["exa_cache"].
  # Fallback rescue (exa_rescue_enabled): when a direct fetch fails (403,
  # timeouts, empty-body, soft-404, low-confidence), Exa self-verifies the
  # same domain to rescue bot-blocks to Active, or discovers a replacement
  # canonical domain (reported as moved-to:<new> so verify updates the row).
  # Social/builder and service-hosts are never rescued; TLS errors never
  # rescue same-domain (strict TLS) but may still discover a replacement.
  exa_enabled: true
  exa_rescue_enabled: true
  exa_timeout_seconds: 15
  exa_num_results: 5
  exa_search_type: fast
  exa_max_calls_per_run: 20
  exa_api_key: ""

output:
  countries_dir: data/countries
  index_path: data/countries/INDEX.md

state_path: state/state.json

# K-12 sources (FR annuaire, OSM, dotgov districts, NZ schools) enabled: full indexing.
k12_enabled: true

# ISO2 -> multilingual keyword-group mapping is in src/util.py (KEYWORDS_I18N).
# Country inference: source ISO2 preferred, else suffix map, else "XX".
# Defaults live in src/geo.py DEFAULT_SUFFIX_COUNTRY (single source of truth).
# Add entries here ONLY to override/extend them (merged at runtime via
# merge_suffix_map). Empty by default to avoid a second copy drifting.
suffix_country: {}

blocklist:
  - example.edu
  - test.edu
