name: Curate (discover)

# Rate-limit-sensitive half: hits shared upstream sources (Wikidata SPARQL,
# Overpass, ROR/OpenAlex APIs, Scorecard, WHED). Hourly; every
# enabled source is hit once per session, each capped by its strict hourly
# `per_run` in sources.yaml (kept small so 24 runs/day ≈ one old daily run).
# Writes state/pending.json + re-cited sources; no validation.
on:
  schedule:
    - cron: "0 * * * *"   # hourly at :00 UTC (verify runs at :15/:45, staggered)
  workflow_dispatch:
    inputs:
      source:
        description: "Force one source id (optional)"
        required: false
        default: ""

permissions:
  contents: write

# Shared with verify.yml: both write data/countries + state/*.json +
# SUMMARY.md, so they must never overlap (push conflicts + lost updates).
concurrency:
  group: edu-domains-data
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run curator
        run: |
          python src/curate.py --config config.yaml --sources sources.yaml --source "${{ inputs.source || '' }}"

      - name: Commit queue + state
        uses: ./.github/actions/commit-data
        with:
          message_prefix: "chore(data): curate update"
