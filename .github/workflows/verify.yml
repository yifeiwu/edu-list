name: Verify (validate websites)

# Rate-limit-safe half: hits each school website ONCE (homepage only, polite
# UA + delay, hosts spread worldwide), so it runs 2x daily with a higher cap.
# Drains state/pending.json first, then re-verifies oldest rows.
on:
  schedule:
    - cron: "0 6,18 * * *"   # twice daily 06:00 + 18:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Max validations this run (0 = use config.yaml)"
        required: false
        default: "0"
      new_only:
        description: "Only drain pending queue (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: edu-domains-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run verifier
        run: |
          ARGS=(--config config.yaml --limit "${{ inputs.limit || '0' }}")
          if [ "${{ inputs.new_only || 'false' }}" = "true" ]; then ARGS+=(--new-only); fi
          python src/verify.py "${ARGS[@]}"

      - name: Commit updated data + state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/countries state/state.json state/pending.json
          git diff --cached --quiet || git commit -m "chore(data): verify update $(date -u +%F-%H%M)"
          git push

      - name: Upload per-country CSVs
        uses: actions/upload-artifact@v4
        with:
          name: countries-${{ github.run_number }}
          path: data/countries
          retention-days: 14
