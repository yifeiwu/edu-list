name: Verify (validate websites)

# Rate-limit-safe half: hits each school website ONCE (homepage only, polite
# UA + delay, hosts spread worldwide), so it runs hourly with a small cap
# (~125 validations/run ≈ one old twice-daily budget spread over 24 runs).
# Drains state/pending.json first, then re-verifies oldest rows.
on:
  schedule:
    - cron: "30 * * * *"   # hourly at :30 UTC (curate runs at :00, staggered)
  workflow_dispatch:
    inputs:
      limit:
        description: "Max validations this run (0 = use config.yaml)"
        required: false
        default: "0"
      new_only:
        description: "Only drain pending queue (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

# Shared with curate.yml: both write data/countries + state/*.json +
# SUMMARY.md, so they must never overlap.
concurrency:
  group: edu-domains-data
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run verifier
        run: |
          ARGS=(--config config.yaml --limit "${{ inputs.limit || '0' }}")
          if [ "${{ inputs.new_only || 'false' }}" = "true" ]; then ARGS+=(--new-only); fi
          python src/verify.py "${ARGS[@]}"

      - name: Commit updated data + state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/countries state/state.json state/pending.json SUMMARY.md
          git diff --cached --quiet || git commit -m "chore(data): verify update $(date -u +%F-%H%M)"
          git pull --rebase --autostash || true
          git push || (sleep 10; git pull --rebase --autostash && git push)

      - name: Upload per-country CSVs
        uses: actions/upload-artifact@v4
        with:
          name: countries-${{ github.run_number }}
          path: data/countries
          retention-days: 14
