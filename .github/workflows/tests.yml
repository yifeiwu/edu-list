name: Tests

on:
  push:
    branches: ["**"]
    # Hourly curate/verify bots only touch data + state; skip the test
    # matrix for those (~48 runs/day saved). Code pushes still run.
    paths-ignore: ["data/**", "state/**", "SUMMARY.md"]
  pull_request:
    paths-ignore: ["data/**", "state/**", "SUMMARY.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev deps
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests

      - name: Typecheck
        run: mypy src

      - name: Unit tests
        run: pytest -q
