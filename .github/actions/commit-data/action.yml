name: commit-data
description: Commit data/countries + state + SUMMARY.md, then pull --rebase + push.

inputs:
  message_prefix:
    description: Commit message prefix (timestamp appended)
    required: true

runs:
  using: composite
  steps:
    - name: Commit queue + state
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data/countries state/state.json state/pending.json SUMMARY.md
        git diff --cached --quiet || git commit -m "${{ inputs.message_prefix }} $(date -u +%F-%H%M)"
        git pull --rebase --autostash || true
        git push || (sleep 10; git pull --rebase --autostash && git push)
