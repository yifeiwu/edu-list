# Source registry. EVERY enabled source is hit once per curate session; most
# are capped by strict hourly `per_run` + `timeout_seconds` (~200 raw
# candidates/hour across capped sources ≈ one old daily run spread over 24
# sessions). Per-adapter cursors in state/state.json (offsets/pages/suffix
# rotation) advance coverage session-to-session. Exception: hipo is one
# static bulk file ingested whole each run (single GET, no per_run); the
# pending queue + verify drain pace validation.
# kind: bulk-json | api-paged | sparql | csv-download | html-limited | overpass
sources:
  - id: hipo
    kind: bulk-json
    enabled: true
    url: https://raw.githubusercontent.com/Hipo/university-domains-list/master/world_universities_and_domains.json
    license: MIT
    # No per_run: whole file ingested in one go (see header comment).
    timeout_seconds: 60
  - id: ror
    kind: api-paged
    enabled: true
    url: https://api.ror.org/organizations
    license: CC0
    per_run: 15
    timeout_seconds: 40
  - id: openalex
    kind: api-paged
    enabled: true
    url: https://api.openalex.org/institutions
    license: CC0
    per_run: 15
    timeout_seconds: 40
    # Optional override for the OpenAlex polite pool
    # (https://docs.openalex.org/). When empty, the contact email is derived
    # from config.yaml validation.user_agent, else DEFAULT_MAILTO.
    mailto: edu-domains-bot@example.com
  - id: wikidata
    kind: sparql
    enabled: true
    url: https://query.wikidata.org/sparql
    license: CC0
    per_run: 15
    timeout_seconds: 60
  - id: scorecard
    kind: csv-download
    enabled: true
    # Fallback URL; the adapter resolves the dated release zip from the data
    # page (URLs rotate per release, e.g. ..._06102026.zip). The full ~23MB
    # zip is still fetched each hour; only `per_run` rows are consumed via
    # cursor, so keep this small.
    url: https://ed-public-download.scorecard.network/downloads/Most-Recent-Cohorts-Institution_06102026.zip
    license: US-public-domain
    per_run: 15
    timeout_seconds: 180
  - id: france-annuaire
    kind: api-paged
    enabled: true
    url: https://data.education.gouv.fr/api/explore/v2.1/catalog/datasets/fr-en-annuaire-education/records
    license: Etalab-2.0
    per_run: 15
    timeout_seconds: 40
  - id: osm
    kind: overpass
    enabled: true # quota-sensitive, one bbox per session
    url: https://overpass-api.de/api/interpreter
    license: ODbL
    per_run: 15
    timeout_seconds: 90
  - id: whed
    kind: html-limited
    enabled: true
    # Polite gap-filler only: few detail pages/session, IDs cited, ToS respected.
    url: https://whed.net/
    license: IAU-proprietary-limited
    per_run: 2
    timeout_seconds: 60
  - id: dotgov
    kind: csv-download
    enabled: true
    url: https://raw.githubusercontent.com/cisagov/dotgov-data/main/current-full.csv
    license: CC0
    per_run: 10
    timeout_seconds: 60
  - id: cricos
    kind: api-paged
    enabled: true
    url: https://data.gov.au/data/api/3/action/package_show
    license: CC-BY-2.5-AU
    per_run: 15
    timeout_seconds: 120
    package_id: e5ae7059-bfa8-4fa4-a5c0-c13cf3520193
    resource_name: CRICOS Institutions.csv
  - id: nuc-ng
    kind: html-limited
    enabled: true
    url: https://www.nuc.edu.ng/nigerian-univerisities/federal-univeristies
    license: NG-open-data
    per_run: 20
    timeout_seconds: 60
  - id: nz-schools
    kind: api-paged
    enabled: true
    url: https://catalogue.data.govt.nz/api/3/action/datastore_search
    license: CC-BY-4.0
    per_run: 15
    timeout_seconds: 60
    resource_id: 4b292323-9fcc-41f8-814b-3c7b19cf14b3
  - id: deqar
    kind: csv-download
    enabled: true
    url: https://backend.deqar.eu/static/daily-csv/deqar-institutions.csv
    license: PDDL
    per_run: 15
    timeout_seconds: 60
  - id: ipeds
    kind: csv-download
    enabled: true
    # Year-stamped file; the adapter rolls back up to 2 years when the
    # configured year 404s after the annual release cycle.
    url: https://nces.ed.gov/ipeds/datacenter/data/HD2024.zip
    license: US-public-domain
    per_run: 15
    timeout_seconds: 120

# Removed sources (code deleted; re-adding needs a new adapter + tests):
# - ugc-in: UGC India blocks bots (HTTP 403, WAF). Needs browser/API route.
# - crtsh: crt.sh 502s on %-wildcard CT queries (full-table scans).
# - commoncrawl: CDX prefix scans + regex filters time out (504/502).
# - eter: heavy ~93MB/session Zenodo dump; removed 2026-09-14.
# - gias/france-sup/giga/edudirectory: no stable bulk URL configured.
